<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms In HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Forms In HTML</h1>

    <form action="/submit" method="post">
    <div>
    <label for="username">Enter Your Username</label>
    <input type="text" name="username" id="username" placeholder="Enter your username here">
    </div>

    <hr>
    <h3>Select your gender : </h3>

    <div>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">female</label>
    </div>

    <hr>
    <h4>Please enter your password here : </h4>
    <div>
        <label for="password">Enter your password here : </label>
        <input type="password" name="password" id="password">
    </div>

    <hr>

    <div>
        <label for="personality">Are You GAY?</label>
        <input type="checkbox" name="personality" id="personality">
    </div>

    <hr>
    <div>
    <img src="img/image.png" alt="More input types in HTML Forms" height="600">
    </div>

    <div>
        <hr>
    </div>
    <div>
        <label for="submit">Click here to submit</label>
        <input type="submit" name="submittion" id="submit" value="submit">
    </div>
    </form>
    
</body>
</html>
