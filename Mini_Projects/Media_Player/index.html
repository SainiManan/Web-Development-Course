<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a very basic media player made with HTML">
    <title>Making a basic media player in HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1 class="red bg-yellow" >Basic Media Player In HTML</h1>
        </nav>
    </header>

    <hr color="black" >

    <main>
        <div>
            <h4>This is a basic media player made with all the knowledge i have of HTML right now</h4>
        </div>

        <hr color="black">

        <div>
            <img src="img/Screenshot 2026-10-25 191810.png" alt="Practice Problem">
        </div>

        <div>
            <hr color="black">
            <h3>Videos</h3>
            <hr color="black">
        </div>

        <div>
            <video src="videos/sample-10s-vp9.mp4" controls height="280" muted  preload="metadata"></video>
            <video src="videos/sample-10s-360p.mp4" controls height="280" muted  preload="metadata"></video>
            <video src="videos/sample-20s-360p.mp4" controls height="280" muted  preload="metadata"></video>
            <hr color="black">
            <video src="videos/sample-30s-360p.mp4" controls height="280" muted  preload="metadata"></video>
            <video src="videos/sample-5s.mp4" controls height="280" muted  preload="metadata"></video>
            <video src="videos/vlipsy-rick-astley-rick-rolled-hElgqOJl.mp4" controls height="260" muted preload="metadata" poster="img/clickhere.png"></video>
        </div>

        <div>
            <hr color="black"> 
            <h3>Audios</h3>
            <hr color="black">
        </div>

        <div>
            <audio src="audios/sample-12s.mp3" controls muted preload="metadata"></audio> <br>
            <audio src="audios/sample-15s.mp3" controls muted preload="metadata"></audio> <br>
            <audio src="audios/sample-20s.mp3" controls muted preload="metadata"></audio> <br>
            <audio src="audios/sample-3s.mp3" controls muted preload="metadata"></audio> <br>
            <audio src="audios/sample-9s.mp3" controls muted preload="metadata"></audio> <br>
            <audio src="audios/sample-speech-1m.mp3" controls muted preload="metadata"></audio> <br>
        </div>
    </main>

    <footer>
        <hr color="black">
        <h5>Copyright CWS | All rights reserved</h5>
        <hr color="black">
    </footer>
    
</body>
</html>
