<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images, List, Tables In Html</title>
    <link rel="stylesheet" href="style3.css">
</head>

<body>
    <h1>Images, List, Tables In Html</h1>
    <img src="img/Gemini_Generated_Image_hwik0zhwik0zhwik.png" alt="Wukong" height="230">
    <!--This is how we add an image in html-->

    <table>

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Class</th>
            <th>Section</th>
        </tr>

        <tr>
            <td>Tiggly</td>
            <td>67</td>
            <td>6-7</td>
            <td>67a</td>
        </tr>

        <tr>
            <td>Tony</td>
            <td>69</td>
            <td>6-9</td>
            <td>69c</td>
        </tr>
        <!--This is how we make a table in html-->
    </table>

    <!--There are three types of list in html ordered , unordered and definition list-->

    <ul type="square">
        <p>Unordered List</p>
        <li>Apple</li>
        <li>Banana</li>
        <li>Avacado</li>
    </ul>

    <ol type="I">
        <p>Ordered List</p> <!--We can also change the type of the pointer in lists-->
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>

    <dl>
        <p>Definition list</p>
        <dt>
            HTML
        </dt>
        <dd>
            HyperText Markup Language: The standard language for creating web pages.
        </dd>
    </dl>

    <script src="script3.js"></script>
</body>

</html>
